<rect x="1730" y="300" width="390" height="618" rx="8" class="keybox"/>
<text x="1746" y="330" class="keyh">Relationships</text>
<text x="1746" y="362" class="kt"><tspan class="kb">Building</tspan> contains <tspan class="kb">Study Spot</tspan></text>
<text x="1746" y="380" class="k1m">one-to-many</text>
<text x="1746" y="408" class="kt"><tspan class="kb">Student User</tspan> submits <tspan class="kb">Study Spot</tspan></text>
<text x="1746" y="426" class="k1m">one-to-many</text>
<text x="1746" y="454" class="kt"><tspan class="kb">Student User</tspan> receives <tspan class="kb">AI Recommendation</tspan></text>
<text x="1746" y="472" class="k1m">one-to-many</text>
<text x="1746" y="500" class="kt"><tspan class="kb">Student User</tspan> saves <tspan class="kb">Saved Filter</tspan></text>
<text x="1746" y="518" class="k1m">one-to-many</text>
<text x="1746" y="546" class="kt"><tspan class="kb">Study Spot</tspan> offers <tspan class="kb">Amenity</tspan></text>
<text x="1746" y="564" class="kmm">many-to-many*</text>
<text x="1746" y="592" class="kt"><tspan class="kb">Student User</tspan> favorites <tspan class="kb">Study Spot</tspan></text>
<text x="1746" y="610" class="kmm">many-to-many*</text>
<text x="1746" y="642" class="kn">* Stored through a join table (purple).</text>
<text x="1746" y="676" class="keyh2">How to read the line ends</text>
<line x1="1762" y1="693" x2="1762" y2="711" class="mk"/>
<line x1="1768" y1="693" x2="1768" y2="711" class="mk"/>
<line x1="1746" y1="702" x2="1790" y2="702" class="ln"/>
<text x="1802" y="707" class="kt">exactly one</text>
<line x1="1762" y1="727" x2="1762" y2="745" class="mk"/>
<line x1="1760" y1="736" x2="1746" y2="726" class="mk"/>
<line x1="1760" y1="736" x2="1746" y2="746" class="mk"/>
<line x1="1746" y1="736" x2="1790" y2="736" class="ln"/>
<text x="1802" y="741" class="kt">many (zero or more)</text>
<text x="1746" y="770" class="kt"><tspan class="key pk">PK</tspan>  primary key   <tspan class="key fk">FK</tspan>  foreign key</text>
<text x="1746" y="796" class="kn">Spots with no submitted_by_user_id are the</text>
<text x="1746" y="814" class="kn">built-in sample spots. Busyness is a typical</text>
<text x="1746" y="832" class="kn">level, not live data. auth_user_id links to</text>
<text x="1746" y="850" class="kn">Supabase Auth (auth.users). AI Recommendation</text>
<text x="1746" y="868" class="kn">caches Gemini results; only the Edge Function</text>
<text x="1746" y="886" class="kn">reads or writes it.</text>
</svg>