<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BYU Study Spot Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main id="app"></main>

  <!-- Shared overlays -->
  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <aside id="filter-panel" class="sheet sheet-filters" role="dialog" aria-modal="true" aria-labelledby="fp-title" hidden></aside>
  <div id="spot-dialog" class="sheet sheet-spot" role="dialog" aria-modal="true" aria-labelledby="sd-title" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Order matters: supabase → data → db → store → components → pages → app -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
