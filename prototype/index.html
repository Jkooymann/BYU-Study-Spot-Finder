<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BYU Study Spot Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css?v=2026-11-19b">
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main id="app"></main>

  <!-- Shared overlays -->
  <div id="sheet-backdrop" class="backdrop" hidden></div>
  <aside id="filter-panel" class="sheet sheet-filters" role="dialog" aria-modal="true" aria-labelledby="fp-title" hidden></aside>
  <div id="spot-dialog" class="sheet sheet-spot" role="dialog" aria-modal="true" aria-labelledby="sd-title" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- AI spot suggestions (js/recommend.js): button + panel, on every page -->
  <button type="button" id="ai-fab" class="ai-fab" aria-expanded="false" aria-controls="ai-panel" aria-label="Suggest spots based on my favorites"></button>
  <section id="ai-panel" class="ai-panel" role="dialog" aria-labelledby="ai-title" aria-live="polite" hidden></section>

  <!-- Order matters: supabase → data → db → store → components → pages → recommend → okr → app -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js?v=2026-11-19a"></script>
  <script src="js/data.js?v=2026-11-19a"></script>
  <script src="js/db.js?v=2026-11-19a"></script>
  <script src="js/store.js?v=2026-11-19a"></script>
  <script src="js/components.js?v=2026-11-19b"></script>
  <script src="js/campus-map.js?v=2026-11-19a"></script>
  <script src="js/pages.js?v=2026-11-19b"></script>
  <script src="js/account.js?v=2026-11-19a"></script>
  <script src="js/recommend.js?v=2026-11-19a"></script>
  <!-- OKR tracking + the admin's OKR Trackers page (js/okr/README.md). Before app.js, which starts the site. -->
  <script src="js/okr/okr-api.js?v=2026-11-19a"></script>
  <script src="js/okr/session-tracker.js?v=2026-11-19a"></script>
  <script src="js/okr/search-tracker.js?v=2026-11-19a"></script>
  <script src="js/okr/okr-panel.js?v=2026-11-19a"></script>
  <script src="js/okr/okr-trackers-page.js?v=2026-11-19a"></script>
  <script src="js/app.js?v=2026-11-19a"></script>
</body>
</html>
